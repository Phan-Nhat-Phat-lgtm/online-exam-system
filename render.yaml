services:
  - type: web
    name: exam-backend
    runtime: python
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python create_admin.py
    startCommand: |
      cd backend
      gunicorn exam_system.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # DATABASE_URL được set thủ công trong Render Dashboard (Environment)
      # sang Aiven — KHÔNG dùng fromDatabase của Render DB cũ nữa.
      # (Migrate data: Render DB → Aiven ngày 2026-07-27)
      - key: DATABASE_URL
        sync: false
      - key: RENDER
        value: "true"

  - type: web
    name: exam-frontend
    runtime: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://exam-backend-n1fc.onrender.com/api
